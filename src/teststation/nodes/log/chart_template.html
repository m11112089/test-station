<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axelera Bare Board 25 °C</title>
<!--PLOTLY-->
<style>
  :root{
    --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --line:rgba(11,11,11,.10);
    --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
    --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948; --crit:#d03b3b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--page);color:var(--ink);
       font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
  header{padding:12px 18px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
  h1{font-size:17px;margin:0 0 3px}
  .sub{color:var(--ink2);font-size:12.5px}
  .bar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;
       padding:9px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
  .lab{color:var(--ink2);font-size:12px;font-weight:600;letter-spacing:.02em;
       text-transform:uppercase}
  button{background:var(--surface);border:1px solid var(--axis);border-radius:5px;
         color:var(--ink);cursor:pointer;font:inherit;font-size:12.5px;padding:5px 11px}
  button:hover{border-color:var(--ink2)}
  button.on{background:var(--s1);border-color:var(--s1);color:#fff;font-weight:600}
  label.chk{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;
            color:var(--ink2);cursor:pointer;user-select:none}
  label.chk input{accent-color:var(--s1);margin:0}
  #chart{width:100%;height:76vh;min-height:520px;background:var(--surface)}
  section{padding:12px 18px 20px;border-top:1px solid var(--line)}
  h2{font-size:14px;margin:0 0 3px}
  .hint{color:var(--ink2);font-size:12.5px;margin-bottom:9px}
  .scroll{overflow:auto;max-height:40vh;border:1px solid var(--line);border-radius:6px;
          background:var(--surface)}
  table{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
  th,td{border-bottom:1px solid var(--grid);padding:6px 10px;text-align:right;white-space:nowrap}
  th:first-child,td:first-child,th.l,td.l{text-align:left}
  thead th{background:var(--page);position:sticky;top:0;font-weight:700;color:var(--ink2);
           border-bottom:1px solid var(--axis)}
  tr.grp td{background:var(--page);font-weight:700;color:var(--ink2);text-align:left}
  .sw{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;
      vertical-align:-1px}
</style>
</head>
<body>

<header>
  <h1 id="title">test-station run <span class="sub" id="win"></span></h1>
  <div class="sub" id="sub"></div>
  <div class="sub" id="axnote" style="margin-top:2px"></div>
</header>

<div class="bar">
  <span class="lab">Show</span>
  <button class="on" data-g="default" type="button">Default</button>
  <button data-g="all" type="button">All</button>
  <span id="groupbtns"></span>
  <span class="lab" style="margin-left:10px">Drag</span>
  <button id="m-zoom" class="on" type="button">Box zoom</button>
  <button id="m-stats" type="button">Stats select</button>
  <button id="reset" type="button">Reset</button>
  <label class="chk" style="margin-left:10px"><input type="checkbox" id="bands" checked> DUT powered</label>
  <label class="chk"><input type="checkbox" id="lims" checked> Limits</label>
  <label class="chk"><input type="checkbox" id="marks" checked> Marks</label>
  <label class="chk" title="Hovering lists every visible signal at that instant, instead of only the nearest single point."><input type="checkbox" id="unified" checked> Compare all signals on hover</label>
</div>

<div id="chart"></div>

<section>
  <h2>Statistics for the selected range</h2>
  <div class="hint" id="rng">Switch to <b>Stats select</b> and drag a box across the chart, or press <b>Current view</b> / <b>Whole record</b>.</div>
  <div class="bar" style="padding:0 0 10px;border:0;background:none">
    <button id="s-view" type="button">Current view</button>
    <button id="s-all" type="button">Whole record</button>
    <button id="s-csv" type="button">Copy table</button>
    <label class="chk"><input type="checkbox" id="s-vis" checked> Visible traces only</label>
  </div>
  <div class="scroll">
    <table>
      <thead><tr><th class="l">Signal</th><th class="l">Unit</th><th>Count</th><th>Min</th><th>Max</th>
        <th>Mean</th><th>Std</th><th>Mean (|z|&le;3)</th></tr></thead>
      <tbody id="tb"><tr><td colspan="8" class="l">No range selected.</td></tr></tbody>
    </table>
  </div>
</section>

<script>
const DATA = /*DATA*/null;
const CSS = getComputedStyle(document.documentElement), tok = n=>CSS.getPropertyValue(n).trim();
const HUES = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'].map(tok);

function hex2rgb(h){h=h.replace('#','');return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16));}
function shade(h,t){const to=t>0?255:0,k=Math.abs(t);
  return '#'+hex2rgb(h).map(v=>Math.round(v+(to-v)*k).toString(16).padStart(2,'0')).join('');}
/* past 8 series hue alone cannot carry identity - the legend and hover label do,
   and lightness tiers keep neighbouring channels apart. Tiers darken first: on a
   light surface a lightened step loses contrast before it gains separation. */
const tier=[0,-.32,-.58,.26];
const rampColor = i => shade(HUES[i%8], tier[Math.floor(i/8)%4]);

/* ------------------------------------------------- time, kept timezone-proof */
/* Every timestamp in the logs is a wall-clock reading with no zone attached. Plotly
   formats a NUMERIC date axis in the viewer's local timezone, which would slide the
   whole chart by the reader's UTC offset - 8 h here, something else in Milan. Feeding
   it naive "YYYY-MM-DD HH:MM:SS" strings instead pins the axis to the logged clock for
   every reader. Numbers are still shipped (compact) and kept alongside for the maths. */
const p2 = x=>String(x).padStart(2,'0');
function wall(msv){
  const d=new Date(msv);
  return d.getUTCFullYear()+'-'+p2(d.getUTCMonth()+1)+'-'+p2(d.getUTCDate())+' '+
         p2(d.getUTCHours())+':'+p2(d.getUTCMinutes())+':'+p2(d.getUTCSeconds());
}
const toMs = v => typeof v==='number' ? v
               : Date.parse(String(v).trim().replace(' ','T').replace(/Z?$/,'Z'));

/* ------------------------------------------------------------------ series */
/* sync.py 不對齊任何東西:每條 series 保留自己的取樣時刻。
   s.t = numeric ms(統計與二分搜尋用);s.x = wall-clock 字串(Plotly 用)。 */
const GROUPS = DATA.groups, ORDER = DATA.order;
/* °C owns the left axis; every other unit shares the right one, as in the reference
   chart. Isolating one group with the buttons is what makes that scale readable. */
const onY2 = s => !/^°?[CF]$/.test(s.unit||'');
const AXFIX = (DATA.axelera||{}).label || null;   /* 選配:舊擷取腳本的修正欄 */

/* 每條 series 帶自己的時間戳,不重取樣也不內插:報告上每個點都是真的量到的。
   cols[].t 是相對 DATA.t0 的整數毫秒(省空間),這裡還原成絕對時間。 */
const absT = c => Float64Array.from(c.t, o => DATA.t0 + o);

const rawAxIdx = DATA.cols.findIndex(c=>c.name==='Axelera_Avg_Temp');
const seq={};                              // per-group hue counter
const S = DATA.cols.map((c,i)=>{
  const g=c.group, ref=c.ref, fix=c.name===AXFIX;
  seq[g] = seq[g]||0;
  let color, width=1.3, dash='dashdot';
  if(g==='ambient' && /nominal/i.test(c.name)){ color=tok('--muted'); width=2; dash='dash'; }
  else if(g==='ambient'){ color=tok('--ink'); width=2.4; dash='solid'; }
  else if(ref){ color=tok('--crit'); width=2.4; dash='solid'; }
  else if(g==='tc'){ color=rampColor(seq[g]++); width=1.1; dash='solid'; }
  else{
    /* The Axelera capture script drops the minus sign below 0 °C, so the raw trace and
       the sign-restored one are both shipped: they coincide above zero and mirror about
       0 °C where the sign was lost. Same hue, so the pair reads as one signal; the
       restored one is solid and heavier because it is the physical value. */
    const hue = HUES[(fix? (rawAxIdx<0?i:rawAxIdx) : seq[g]++)%8];
    const deep = g==='dut';
    color = shade(hue, deep? (fix?-.38:-.12) : (g==='sysmon'? -.30 : .12));
    width = fix?2.2:(deep?1.8:1.3);
    dash  = deep?(fix?'solid':'dot'):(g==='sysmon'?'solid':'dashdot');
  }
  const t = absT(c);
  return {name:c.name, group:g, unit:c.unit||'-', t:t, x:Array.from(t, wall), y:c.v,
          vis:c.vis, color:color, width:width, dash:dash};
});

/* -------------------------------------------------------------------- plot */
const chart=document.getElementById('chart');
let mode='zoom';
let shown=new Set(S.filter(s=>s.vis).map(s=>s.name));

function shapes(){
  const out=[];
  if(document.getElementById('bands').checked)
    DATA.bands.forEach(b=>out.push({type:'rect',xref:'x',yref:'paper',
      x0:wall(b.t0),x1:wall(b.t1),y0:0,y1:1,line:{width:0},layer:'below',
      fillcolor:'rgba(42,120,214,.13)'}));
  // the setpoint limits live on the °C axis, so they only mean something while it is up
  if(document.getElementById('marks').checked)
    (DATA.marks||[]).forEach(m=>out.push({type:'line',xref:'x',yref:'paper',
      x0:wall(m.t),x1:wall(m.t),y0:0,y1:1,layer:'below',
      line:{color:tok('--muted'),width:1,dash:'dot'}}));
  if(document.getElementById('lims').checked && tempShown())
    DATA.limits.forEach(l=>out.push({type:'line',xref:'paper',yref:'y',
      x0:0,x1:1,y0:l.y,y1:l.y,line:{color:tok('--muted'),width:1,dash:'dash'}}));
  return out;
}
const tempShown = ()=>S.some(s=>!onY2(s) && shown.has(s.name));
function annos(){
  const out = document.getElementById('marks').checked
    ? (DATA.marks||[]).map(m=>({text:m.text,x:wall(m.t),xref:'x',yref:'paper',y:1,
        yanchor:'bottom',showarrow:false,textangle:-90,xshift:-6,
        font:{size:10,color:tok('--ink2')}}))
    : [];
  return out.concat(document.getElementById('lims').checked && tempShown()
    ? DATA.limits.map(l=>({text:l.label,xref:'paper',yref:'y',x:1,xanchor:'right',
        y:l.y,yanchor: l.y>0?'bottom':'top',showarrow:false,
        font:{size:11,color:tok('--ink2')},bgcolor:tok('--surface'),borderpad:2}))
    : []);
}
function layout(){
  // the right-hand axis only appears when something is actually riding it, so the
  // default temperature-only view stays a single-scale chart
  const useY2 = S.some(s=>onY2(s) && shown.has(s.name));
  const useY  = S.some(s=>!onY2(s) && shown.has(s.name));
  return {
    paper_bgcolor:tok('--surface'), plot_bgcolor:tok('--surface'),
    font:{color:tok('--ink2'),size:11.5,
          family:'system-ui,-apple-system,"Segoe UI",sans-serif'},
    margin:{l:74,r:useY2?105:16,t:14,b:46},
    xaxis:{title:{text:'Time (wall clock — the three clocks agree to within one 10 s sample)',
                  font:{size:12}}, type:'date',
           gridcolor:tok('--grid'), linecolor:tok('--axis'),
           range:[wall(DATA.window.start),wall(DATA.window.end)],
           hoverformat:'%Y-%m-%d %H:%M:%S',
           showspikes:true, spikemode:'across', spikethickness:1, spikedash:'dot',
           spikecolor:tok('--muted')},
    yaxis:{title:{text:'Temperature (°C)',font:{size:12}}, ticksuffix:' °C',
           visible:useY,
           gridcolor:tok('--grid'), zerolinecolor:tok('--axis'), linecolor:tok('--axis')},
    yaxis2:{title:{text:'Volts / amps / % / counters',font:{size:12}},
            overlaying:'y', side:'right', showgrid:!useY, visible:useY2,
            zeroline:false, linecolor:tok('--axis'), tickfont:{size:10.5}},
    // the second axis needs its ticks and title in the right margin, so the legend
    // steps aside for it rather than sitting on top of the labels
    legend:{x:useY2?1.10:1.005,y:1,xanchor:'left',font:{size:11},bgcolor:'rgba(0,0,0,0)',
            groupclick:'toggleitem',tracegroupgap:8},
    // "x unified" answers the question actually being asked of this chart - what was
    // every sensor doing at this instant - instead of reporting one nearest point
    hovermode: document.getElementById('unified').checked ? 'x unified' : 'closest',
    hoverdistance:20, hoverlabel:{namelength:-1},
    dragmode: mode==='stats'?'select':'zoom', selectdirection:'h',
    shapes:shapes(), annotations:annos(),
  };
}
function traces(){
  return S.map(s=>({
    type:'scattergl', mode:'lines', name:s.name, x:s.x, y:s.y,
    yaxis: onY2(s)?'y2':'y',
    legendgroup:s.group, legendgrouptitle:{text:GROUPS[s.group],font:{size:11.5}},
    line:{color:s.color,width:s.width,dash:s.dash}, connectgaps:false,
    visible: shown.has(s.name)?true:'legendonly',
    // %{y} already carries the y-axis ticksuffix, so only y2 series need a unit added.
    // The name goes in <extra> (the side box) so it reads correctly in "closest" mode
    // and is not duplicated in "x unified", where Plotly labels each row itself.
    hovertemplate:'%{y}'+(onY2(s) && s.unit!=='-' ? ' '+s.unit : '')
                  +'<extra>'+s.name+'</extra>',
  }));
}
function draw(){ Plotly.react(chart, traces(), layout(),
  {responsive:true, displaylogo:false, modeBarButtonsToRemove:['lasso2d','select2d']}); }

/* ------------------------------------------------------------------ toolbar */
/* one button per group actually present in the CSV, so a new source needs no edit here */
const gb=document.getElementById('groupbtns');
ORDER.filter(g=>S.some(s=>s.group===g)).forEach(g=>{
  const b=document.createElement('button');
  b.type='button'; b.dataset.g=g; b.textContent=GROUPS[g];
  b.style.marginRight='8px';
  gb.appendChild(b);
});
document.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('[data-g]').forEach(o=>o.classList.toggle('on',o===b));
  const g=b.dataset.g;
  shown = new Set(S.filter(s=> g==='all'? true : (g==='default'? s.vis : s.group===g))
                   .map(s=>s.name));
  draw();
});
function setMode(m){ mode=m;
  document.getElementById('m-zoom').classList.toggle('on',m==='zoom');
  document.getElementById('m-stats').classList.toggle('on',m==='stats');
  Plotly.relayout(chart,{dragmode:m==='stats'?'select':'zoom'}); }
document.getElementById('m-zoom').onclick =()=>setMode('zoom');
document.getElementById('m-stats').onclick=()=>setMode('stats');
document.getElementById('reset').onclick  =()=>
  Plotly.relayout(chart,{'xaxis.range':[wall(DATA.window.start),wall(DATA.window.end)],
                         'yaxis.autorange':true,'yaxis2.autorange':true});
document.getElementById('bands').onchange=
document.getElementById('lims').onchange =()=>
  Plotly.relayout(chart,{shapes:shapes(),annotations:annos()});
document.getElementById('unified').onchange=e=>
  Plotly.relayout(chart,{hovermode: e.target.checked?'x unified':'closest'});
/* a legend click can put something on y2 (or take the last thing off it), so mirror
   Plotly's own visibility back into `shown` and bring the axis in or out with it.
   Registered after the first draw - chart.on only exists once Plotly owns the div. */
function syncY2(){
  const next=new Set();
  chart.data.forEach(t=>{ if(t.visible===true) next.add(t.name); });
  shown=next;
  const useY2 = S.some(s=>onY2(s) && shown.has(s.name));
  const useY  = tempShown();
  if(chart.layout.yaxis2 && (useY2!==chart.layout.yaxis2.visible ||
                             useY!==chart.layout.yaxis.visible))
    Plotly.relayout(chart,{'yaxis.visible':useY, 'yaxis2.visible':useY2,
                           'yaxis2.showgrid':!useY,
                           'margin.r':useY2?105:16, 'legend.x':useY2?1.10:1.005,
                           shapes:shapes(), annotations:annos()});
}

/* -------------------------------------------------------------------- stats */
function lower(xs,v){let lo=0,hi=xs.length;while(lo<hi){const m=(lo+hi)>>1;
  if(xs[m]<v)lo=m+1;else hi=m;}return lo;}
function stat(s,a,b){
  let i=lower(s.t,a),n=0,mn=Infinity,mx=-Infinity,sum=0,sq=0;const v=[];
  for(;i<s.t.length&&s.t[i]<=b;i++){const y=s.y[i];
    if(y===null||y===undefined||!isFinite(y))continue;
    n++;sum+=y;sq+=y*y;if(y<mn)mn=y;if(y>mx)mx=y;v.push(y);}
  if(!n)return null;
  const mean=sum/n, sd=Math.sqrt(Math.max(0,sq/n-mean*mean));
  let cs=0,cn=0; if(sd>0) for(const y of v) if(Math.abs(y-mean)<=3*sd){cs+=y;cn++;}
  return {n,mn,mx,mean,sd,trim:cn?cs/cn:mean};
}
const fmtT = wall;
function f1(v){
  if(!isFinite(v)) return '–';
  const a=Math.abs(v);
  if(a!==0 && a>=1e6) return v.toExponential(3);
  return v.toFixed(a>=1000?0:2);
}

let rows=[], last=null;
function render(a,b){
  if(a>b){const t=a;a=b;b=t;}
  last=[a,b];
  const onlyVis=document.getElementById('s-vis').checked;
  const hrs=(b-a)/3600000;
  document.getElementById('rng').innerHTML='<b>'+fmtT(a)+'</b> → <b>'+fmtT(b)+'</b> ('+
    (hrs>=24?(hrs/24).toFixed(2)+' days':hrs.toFixed(2)+' h')+')';
  rows=[]; let html='';
  ORDER.forEach(g=>{
    const list=S.filter(s=>s.group===g&&(!onlyVis||shown.has(s.name)));
    if(!list.length)return;
    html+='<tr class="grp"><td colspan="8">'+GROUPS[g]+'</td></tr>';
    list.forEach(s=>{
      const st=stat(s,a,b);
      const u=s.unit==='C'?'°C':(s.unit==='-'?'count':s.unit);
      const c=st?[st.n,f1(st.mn),f1(st.mx),f1(st.mean),f1(st.sd),f1(st.trim)]
                :[0,'–','–','–','–','–'];
      rows.push([s.name,u].concat(c));
      html+='<tr><td class="l"><span class="sw" style="background:'+s.color+'"></span>'+
            s.name+'</td><td class="l">'+u+'</td>'+
            c.map(x=>'<td>'+x+'</td>').join('')+'</tr>';
    });
  });
  document.getElementById('tb').innerHTML=html||'<tr><td colspan="8" class="l">No data in range.</td></tr>';
}
function curRange(){
  const r=chart.layout.xaxis.range;
  return r?[toMs(r[0]),toMs(r[1])]:[DATA.window.start,DATA.window.end];
}
document.getElementById('s-view').onclick=()=>{const r=curRange();render(r[0],r[1]);};
document.getElementById('s-all').onclick =()=>render(DATA.window.start,DATA.window.end);
document.getElementById('s-vis').onchange=()=>{ if(last) render(last[0],last[1]); };
document.getElementById('s-csv').onclick =()=>{
  if(!rows.length)return;
  const h=['Signal','Unit','Count','Min','Max','Mean','Std','Mean (|z|<=3)'];
  navigator.clipboard.writeText([h].concat(rows).map(r=>r.join('\t')).join('\n'));
  const b=document.getElementById('s-csv'),t=b.textContent;
  b.textContent='Copied'; setTimeout(()=>b.textContent=t,1200);
};

/* --------------------------------------------------------------------- boot */
document.getElementById('win').textContent=fmtT(DATA.window.start)+' → '+fmtT(DATA.window.end);
document.getElementById('sub').textContent =
  ORDER.filter(g=>S.some(s=>s.group===g))
       .map(g=>S.filter(s=>s.group===g).length+' '+GROUPS[g].toLowerCase())
       .join(' · ')
  +' · '+S.reduce((a,s)=>a+s.y.length,0).toLocaleString()+' samples'
  +' · each series keeps its own sample times (no resampling)'
  +((DATA.marks||[]).length?' · '+DATA.marks.length+' mark'+(DATA.marks.length===1?'':'s'):'')
  +' · built '+DATA.built;
document.getElementById('axnote').innerHTML =
  (DATA.note||'')
  + ((DATA.axelera||{}).fixed
      ? ' &nbsp;·&nbsp; The Axelera capture script logs the magnitude only, so sub-zero die '
        +'temperatures lose their minus sign; "'+AXFIX+'" restores it ('+DATA.axelera.fixed
        +' of '+DATA.axelera.runs+' runs), identified by the raw trace falling while the board '
        +'sensors rise.'
      : '');
if(DATA.title){ document.title = DATA.title;
  document.getElementById('title').firstChild.nodeValue = DATA.title+' '; }

draw();
chart.on('plotly_restyle', syncY2);
chart.on('plotly_selected',ev=>{
  if(mode!=='stats'||!ev)return;
  // the axis speaks wall-clock strings now, so bring the selection back to ms
  if(ev.range&&ev.range.x){render(toMs(ev.range.x[0]),toMs(ev.range.x[1]));return;}
  const t=(ev.points||[]).map(p=>toMs(p.x)).filter(isFinite);
  if(t.length)render(Math.min(...t),Math.max(...t));
});
</script>
</body>
</html>
