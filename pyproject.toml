[project]
name = "teststation"
version = "0.1.0"
description = "eCAL-based test station automation platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "eclipse-ecal>=6.1,<7",
    "pyserial>=3.5",
    "prompt-toolkit>=3.0",
    "pyyaml>=6.0",
    "PySide6>=6.7",
    "numpy>=2.5.3",
]

[project.scripts]
ui = "teststation.ui.app:run_ui"
visualization = "teststation.visualization:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teststation"]
artifacts = ["*.html", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
