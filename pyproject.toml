[project]
name = "teststation"
version = "0.1.0"
description = "eCAL-based test station automation platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "eclipse-ecal>=6.1,<7",
    "pyserial>=3.5",
    "prompt-toolkit>=3.0",
    "textual>=0.80",
    "pyyaml>=6.0",
    "PySide6>=6.7",
]

[project.scripts]
st = "teststation.cli.main:main"
btm_4208sd = "teststation.nodes.btm_4208sd.node:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teststation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
